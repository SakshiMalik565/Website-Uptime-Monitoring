# ==============================================================================
# Nagios Core Service Definitions
# File: /usr/local/nagios/etc/objects/services.cfg or /etc/nagios4/conf.d/services.cfg
# ==============================================================================

# 1. Primary Website Uptime Monitoring Service (HTTP Check)
define service {
    use                     generic-service
    host_name               puppet-agent
    service_description     HTTP_Website_Uptime
    # check_http verifies port 80 returns HTTP 200 within timeout
    check_command           check_http!-u / -w 2 -c 5 -e "HTTP/1.1 200"
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins

    # Optional Event Handler Directive (Uncomment when enabling automated event handler)
    # event_handler         handle_apache_recovery
}

# 2. Host Reachability & Network Ping Check
define service {
    use                     generic-service
    host_name               puppet-agent
    service_description     PING_Network_Latency
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          admins
}

# 3. SSH Service Availability Check
define service {
    use                     generic-service
    host_name               puppet-agent
    service_description     SSH_Service_Port
    check_command           check_ssh
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          admins
}
