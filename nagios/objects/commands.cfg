# ==============================================================================
# Nagios Core Custom Command Definitions
# File: /usr/local/nagios/etc/objects/commands.cfg or /etc/nagios4/conf.d/commands.cfg
# ==============================================================================

# Standard check_http command definition (if not provided by base commands.cfg)
define command {
    command_name    check_http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ $ARG1$
}

# Standard check_ping command definition
define command {
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

# Standard check_ssh command definition
define command {
    command_name    check_ssh
    command_line    $USER1$/check_ssh $HOSTADDRESS$
}

# Optional Event Handler Command: Triggers narrowly scoped recovery playbook
define command {
    command_name    handle_apache_recovery
    command_line    /usr/local/nagios/libexec/eventhandlers/restart-apache-ansible.sh $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$
}
