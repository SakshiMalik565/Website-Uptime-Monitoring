# ==============================================================================
# Nagios Core Host Definitions
# File: /usr/local/nagios/etc/objects/hosts.cfg or /etc/nagios4/conf.d/hosts.cfg
# ==============================================================================

# Generic template reference: linux-server
define host {
    use                     linux-server
    host_name               puppet-agent
    alias                   Puppet Agent Apache Web Server Node
    # Replace PUPPET_AGENT_PRIVATE_IP with the actual private VPC IP of puppet-agent
    address                 PUPPET_AGENT_PRIVATE_IP
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}
