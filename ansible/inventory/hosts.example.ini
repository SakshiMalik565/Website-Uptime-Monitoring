# ==============================================================================
# Ansible Sanitized Example Inventory
# Copy this file to 'hosts.ini' and fill with your actual private VPC IP addresses.
# Note: 'hosts.ini' is git-ignored to prevent credential/IP leakage.
# ==============================================================================

[puppet_agent]
# Replace with the private IP address of the puppet-agent EC2 instance
# Example: 172.31.X.Y
puppet_agent_node ansible_host=PUPPET_AGENT_PRIVATE_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[puppet_master]
# Replace with the private IP address of the puppet-master EC2 instance
# Example: 172.31.X.Z
puppet_master_node ansible_host=PUPPET_MASTER_PRIVATE_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[monitoring]
# Ansible Control Node / Nagios Monitoring Host
localhost ansible_connection=local

[web_servers:children]
puppet_agent
