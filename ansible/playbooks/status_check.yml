---
# ==============================================================================
# Ansible Status Check Playbook
# Target: puppet_agent
# Purpose: Non-destructive health check of Apache2 service and HTTP endpoint
# ==============================================================================

- name: Non-destructive Health & Status Inspection
  hosts: puppet_agent
  become: false
  gather_facts: false

  tasks:
    - name: 1. Check Apache2 systemd service state
      ansible.builtin.command: systemctl is-active apache2
      register: apache_active
      changed_when: false
      failed_when: false

    - name: 2. Test HTTP response from web server
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        method: GET
        status_code: 200
        timeout: 5
      register: http_response
      failed_when: false

    - name: 3. Summarize findings
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Apache Active State: {{ apache_active.stdout }}"
          - "HTTP Status Code   : {{ http_response.status | default('Connection Failed') }}"
